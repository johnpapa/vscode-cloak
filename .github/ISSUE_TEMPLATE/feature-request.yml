name: Feature Request
description: Suggest a new feature or improvement for Cloak
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make Cloak better? We'd love to hear it!

  - type: textarea
    id: description
    attributes:
      label: Feature Description
      description: A clear description of the feature you'd like.
      placeholder: What would you like Cloak to do?
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this feature important? What problem does it solve?
      placeholder: How would this help you?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions or workarounds?
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Mockups, screenshots, or links to similar features in other extensions.
    validations:
      required: false
